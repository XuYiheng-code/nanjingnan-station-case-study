<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>南京南站案例动画 · Styleframe</title>
  <style>
    :root{--ink:#11100e;--paper:#f3efe6;--signal:#f28c45;--blue:#071926;--electric:#8fd7ff;--white:#fffdf8}
    *{box-sizing:border-box}body{margin:0;background:#2a2925;color:var(--white);font-family:"PingFang SC",sans-serif}.frame{position:relative;width:1920px;height:1080px;overflow:hidden;margin:40px auto;box-shadow:0 30px 90px #0008}.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.7) contrast(1.08)}.scrim{position:absolute;inset:0;background:linear-gradient(90deg,#0b0b0aeF 0%,#0b0b0a99 52%,transparent 83%),linear-gradient(0deg,#0b0b0acc,transparent 46%)}.copy{position:absolute;left:116px;bottom:124px;width:1100px}.eyebrow{font:700 22px/1.2 SFMono-Regular,monospace;letter-spacing:.16em;color:var(--signal);margin-bottom:24px}.copy h1{font:700 104px/1.06 "Songti SC",serif;letter-spacing:-.055em;margin:0}.copy h1 em{color:var(--signal);font-style:normal}.copy p{font-size:30px;line-height:1.55;max-width:900px;color:#fffdf8cc}.paper{background:var(--paper);color:var(--ink)}.paper .grid{position:absolute;inset:0;background-image:linear-gradient(#1111 1px,transparent 1px),linear-gradient(90deg,#1111 1px,transparent 1px);background-size:120px 120px}.network{position:absolute;inset:120px}.core,.node{position:absolute;display:grid;place-items:center;border-radius:999px;border:2px solid #1113;background:#fffdf8;box-shadow:0 18px 50px #1112;font-weight:650}.core{left:700px;top:305px;width:280px;height:280px;background:var(--ink);color:var(--white);font:700 44px/1.2 "Songti SC",serif}.node{width:220px;height:80px;font-size:26px}.n1{left:80px;top:90px}.n2{left:40px;top:410px}.n3{left:330px;top:710px}.n4{right:60px;top:100px}.n5{right:20px;top:420px}.n6{right:330px;top:730px}.line{position:absolute;height:3px;background:var(--signal);transform-origin:left center;opacity:.8}.paper h2{position:absolute;left:110px;top:90px;margin:0;font:700 70px/1.15 "Songti SC",serif}.dashboard{background:var(--blue)}.dash{position:absolute;left:150px;right:150px;top:120px;bottom:120px;border:1px solid #8fd7ff66;border-radius:28px;overflow:hidden;box-shadow:0 0 80px #8fd7ff18}.dash img{width:100%;height:100%;object-fit:cover;opacity:.8}.scan{position:absolute;left:0;right:0;top:48%;height:3px;background:var(--electric);box-shadow:0 0 26px var(--electric)}.bracket{position:absolute;left:620px;top:300px;width:370px;height:220px;border:3px solid var(--signal);border-radius:10px}.label{position:absolute;left:1020px;top:330px;color:var(--electric);font:600 25px/1.5 SFMono-Regular,monospace}.dashboard h2{position:absolute;left:150px;bottom:68px;font:700 66px/1.15 "Songti SC",serif;margin:0}.grain{position:absolute;inset:0;opacity:.14;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitchTiles'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E")}
  </style>
</head>
<body>
  <section class="frame"><img class="photo" src="public/images/nanjing-south-aerial.jpeg"><div class="scrim"></div><div class="copy"><div class="eyebrow">一个公共交通枢纽的治理实验</div><h1>物理上是<em>一座站</em><br>治理上却有<em>许多站</em></h1><p>真实照片承担证据，动画只解释照片背后的组织关系。</p></div><div class="grain"></div></section>
  <section class="frame paper"><div class="grid"></div><h2>空间连在一起，权责仍各有边界。</h2><div class="network"><div class="core">南京南站</div><div class="node n1">雨花台区</div><div class="node n2">江宁区</div><div class="node n3">铁路系统</div><div class="node n4">公安 / 交管</div><div class="node n5">资产主体</div><div class="node n6">服务企业</div></div><div class="grain"></div></section>
  <section class="frame dashboard"><div class="dash"><img src="public/images/city-brain-dashboard.jpeg"><div class="scan"></div><div class="bracket"></div><div class="label">SCAN · 04/06<br>事件识别<br>位置 / 图像 / 时限</div></div><h2>城市小脑：让任务进入同一套运行流程。</h2></section>
</body>
</html>
