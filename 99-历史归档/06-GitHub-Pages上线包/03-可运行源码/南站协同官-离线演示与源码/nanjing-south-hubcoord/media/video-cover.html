<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, initial-scale=1" />
    <title>南京南站案例视频封面</title>
    <style>
      :root { --navy: #071926; --orange: #ff9a50; --blue: #8fd7ff; --white: #fffdf8; }
      * { box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
      body { color: var(--white); background: var(--navy); font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; }
      .cover { position: relative; width: 100%; height: 100%; overflow: hidden; isolation: isolate; }
      .background { position: absolute; z-index: -5; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 48%; filter: saturate(.54) contrast(1.08) brightness(.68); transform: scale(1.035); }
      .scrim { position: absolute; z-index: -4; inset: 0; background: linear-gradient(90deg, rgba(2,10,17,.98) 0%, rgba(3,13,21,.8) 56%, rgba(3,13,21,.5) 100%), linear-gradient(0deg, rgba(2,9,15,.92), transparent 58%); }
      .grid { position: absolute; z-index: -3; inset: 0; opacity: .23; background-image: linear-gradient(rgba(143,215,255,.15) 1px, transparent 1px), linear-gradient(90deg, rgba(143,215,255,.15) 1px, transparent 1px); background-size: 128px 128px; }
      .route { position: absolute; z-index: -2; height: 1px; background: linear-gradient(90deg, transparent, rgba(143,215,255,.72), transparent); transform-origin: left; }
      .route.one { top: 39%; left: -4%; width: 80%; transform: rotate(8deg); }
      .route.two { top: 70%; left: 38%; width: 70%; transform: rotate(-18deg); background: linear-gradient(90deg, transparent, rgba(255,154,80,.62), transparent); }
      .route.three { top: 55%; left: 49%; width: 56%; transform: rotate(4deg); }
      .node { position: absolute; z-index: -1; width: 12px; height: 12px; border: 2px solid var(--blue); border-radius: 50%; box-shadow: 0 0 0 12px rgba(143,215,255,.07), 0 0 36px rgba(143,215,255,.5); }
      .node.a { top: 35%; left: 55%; }.node.b { top: 67%; left: 73%; border-color: var(--orange); box-shadow: 0 0 0 12px rgba(255,154,80,.06), 0 0 36px rgba(255,154,80,.5); }.node.c { top: 48%; left: 88%; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 62px 78px 0; }
      .brand { display: flex; align-items: center; gap: 18px; }
      .brand img { width: 72px; height: 72px; }
      .brand-copy { display: grid; gap: 4px; color: rgba(255,255,255,.76); font-size: 34px; line-height: 1.2; }
      .brand-copy small { color: rgba(255,255,255,.58); font-family: ui-monospace, monospace; font-size: 32px; letter-spacing: .04em; }
      .entry { display: grid; justify-items: end; gap: 6px; color: rgba(255,255,255,.62); font-family: ui-monospace, monospace; font-size: 32px; letter-spacing: .08em; }
      .entry strong { color: var(--orange); font-family: "Songti SC", "STSong", serif; font-size: 48px; letter-spacing: .1em; }
      main { margin: 162px 0 0 120px; }
      .kicker { margin: 0 0 26px; color: var(--blue); font-family: ui-monospace, monospace; font-size: 32px; letter-spacing: .1em; }
      h1 { margin: 0; font-family: "Songti SC", "STSong", serif; font-weight: 700; letter-spacing: -.055em; line-height: 1.01; }
      h1 span { display: block; width: max-content; white-space: nowrap; }
      .overline { margin-bottom: 20px; color: rgba(255,255,255,.77); font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 38px; font-weight: 500; letter-spacing: .16em; }
      .core { font-size: 100px; text-shadow: 0 16px 44px rgba(0,0,0,.28); }
      .accent { color: var(--orange); }
      .case { margin-top: 28px; color: rgba(255,255,255,.82); font-size: 34px; letter-spacing: .015em; }
      .phase { display: grid; grid-template-columns: max-content 90px max-content 90px max-content; align-items: center; width: max-content; margin-top: 58px; color: rgba(255,255,255,.62); font-family: ui-monospace, monospace; font-size: 32px; letter-spacing: .08em; }
      .phase i { height: 1px; margin: 0 16px; background: linear-gradient(90deg, var(--orange), var(--blue)); }
      footer { position: absolute; right: 78px; bottom: 54px; left: 78px; display: flex; justify-content: space-between; padding-top: 20px; color: rgba(255,255,255,.5); border-top: 1px solid rgba(255,255,255,.22); font-family: ui-monospace, monospace; font-size: 32px; letter-spacing: .06em; }
      footer strong { color: rgba(255,255,255,.82); font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 34px; font-weight: 500; letter-spacing: .05em; }
    </style>
  </head>
  <body>
    <div class="cover">
      <img class="background" src="../static/assets/nanjing-south-aerial.jpeg" alt="" />
      <div class="scrim"></div><div class="grid"></div>
      <i class="route one"></i><i class="route two"></i><i class="route three"></i>
      <i class="node a"></i><i class="node b"></i><i class="node c"></i>
      <header>
        <div class="brand"><img src="../static/assets/nanyong-mark.svg" alt="" /><span class="brand-copy"><b>清华大学 · 2026</b><small>中国智能社会治理公共政策案例分析大赛</small></span></div>
        <div class="entry"><span>参赛影像作品</span><strong>南雍治道</strong></div>
      </header>
      <main>
        <p class="kicker">CASE FILM · NANJING SOUTH STATION</p>
        <h1>
          <span class="overline">从平台化到智能化：</span>
          <span class="core">政企共创平台企业</span>
          <span class="core accent">何以化解行政分割难题？</span>
          <span class="case">——以南京南站跨区域公共交通枢纽为例</span>
        </h1>
        <div class="phase"><span>碎片化</span><i></i><span>平台化</span><i></i><span>智能化</span></div>
      </main>
      <footer><span>PUBLIC GOVERNANCE · CASE PRESENTATION</span><strong>南京南站案例短片</strong></footer>
    </div>
  </body>
</html>
