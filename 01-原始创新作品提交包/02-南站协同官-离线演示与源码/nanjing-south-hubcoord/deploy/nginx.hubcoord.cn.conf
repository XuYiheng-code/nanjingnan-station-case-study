server {
    listen 80;
    listen [::]:80;
    server_name hubcoord.cn www.hubcoord.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://hubcoord.cn$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cad.hubcoord.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://cad.hubcoord.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hubcoord.cn www.hubcoord.cn;

    ssl_certificate /etc/letsencrypt/live/hubcoord.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hubcoord.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8152;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cad.hubcoord.cn;

    ssl_certificate /etc/letsencrypt/live/hubcoord.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hubcoord.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8152/cad/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
